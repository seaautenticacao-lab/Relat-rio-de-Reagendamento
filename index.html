<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Control | ISP System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --danger: #ef4444;
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --sidebar-w: 260px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-mode {
            --bg-app: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-main); transition: var(--transition); overflow-x: hidden; }

        .app-container { display: flex; min-height: 100vh; }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: var(--transition);
            left: 0;
        }

        .sidebar.collapsed { left: calc(var(--sidebar-w) * -1); }

        .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.3rem; color: var(--primary); margin-bottom: 2.5rem; }
        nav { display: flex; flex-direction: column; gap: 8px; height: 100%; }
        nav a { text-decoration: none; color: var(--text-muted); padding: 0.8rem 1rem; border-radius: 10px; display: flex; align-items: center; gap: 12px; transition: var(--transition); font-weight: 500; }
        nav a.active { background: #2563eb15; color: var(--primary); }
        .spacer { flex-grow: 1; }
        
        .nav-btn { background: var(--bg-app); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 600; margin-bottom: 8px; transition: var(--transition); }

        .main-content { 
            margin-left: var(--sidebar-w); 
            flex-grow: 1; 
            padding: 2rem; 
            width: calc(100% - var(--sidebar-w)); 
            transition: var(--transition);
        }

        .main-content.expanded { margin-left: 0; width: 100%; }

        .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; gap: 20px; }
        .header-left { display: flex; align-items: center; gap: 15px; }

        .btn-toggle-sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .stat-card { display: flex; align-items: center; gap: 1.25rem; }
        .stat-card .icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .icon.blue { background: #eff6ff; color: #1d4ed8; }
        .icon.orange { background: #fff7ed; color: #c2410c; }
        .icon.green { background: #f0fdf4; color: #15803d; }

        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-top: 1rem; }
        .filters-grid input, .filters-grid select { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main); font-size: 0.85rem; outline: none; }

        .table-container { overflow-x: auto; border-radius: 12px; margin-top: 1.5rem; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; background: var(--bg-card); table-layout: fixed; }
        th { background: var(--bg-app); padding: 0.9rem; text-align: left; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 1rem 0.9rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; word-wrap: break-word; }

        tr.row-opened td { background-color: #dcfce7 !important; color: #166534 !important; }
        .txt-full { font-size: 0.8rem; line-height: 1.4; max-height: 120px; overflow-y: auto; padding-right: 5px; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; }
        .badge-pending { background: #f1f5f9; color: #475569; }
        .badge-opened { background: #166534; color: white; }

        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); font-size: 0.8rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }

        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: #1e293b; color: white; border-radius: 8px; transform: translateY(150%); transition: 0.3s; z-index: 1000; font-size: 0.85rem; }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>
    
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo"><i class="fas fa-network-wired"></i><span>ISP Protocol</span></div>
            <nav>
                <a href="#" class="active"><i class="fas fa-columns"></i> <span>Painel</span></a>
                <a href="#" onclick="syncFromCloud()"><i class="fas fa-sync"></i> <span>Sincronizar Nuvem</span></a>
                <a href="#" onclick="exportExcel()"><i class="fas fa-file-export"></i> <span>Exportar</span></a>
                <div class="spacer"></div>
                <button class="nav-btn" onclick="limparTudo()"><i class="fas fa-trash-alt"></i> <span>Zerar Banco</span></button>
                <button class="nav-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i> <span>Tema</span></button>
            </nav>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="btn-toggle-sidebar" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <div>
                        <h1>Controle de Reagendamentos</h1>
                        <p style="color: var(--text-muted); font-size: 0.85rem">Status: <strong id="cloud-status">Verificando...</strong></p>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-plus"></i> Importar Planilha
                </button>
                <input type="file" id="fileInput" hidden accept=".xlsx, .xls">
            </header>

            <section class="stats-grid">
                <div class="card stat-card"><div class="icon blue"><i class="fas fa-users"></i></div><div><span style="font-size:0.7rem; color:var(--text-muted)">Total</span><h2 id="stat-total">0</h2></div></div>
                <div class="card stat-card"><div class="icon orange"><i class="fas fa-clock"></i></div><div><span style="font-size:0.7rem; color:var(--text-muted)">Pendentes</span><h2 id="stat-pending">0</h2></div></div>
                <div class="card stat-card"><div class="icon green"><i class="fas fa-check"></i></div><div><span style="font-size:0.7rem; color:var(--text-muted)">Abertos</span><h2 id="stat-opened">0</h2></div></div>
            </section>

            <section class="card">
                <div class="filters-grid">
                    <input type="text" id="fOS" placeholder="O.S..." onkeyup="applyFilters()">
                    <input type="text" id="fCli" placeholder="Cliente..." onkeyup="applyFilters()">
                    <input type="date" id="fDate" onchange="applyFilters()">
                    <select id="fCity" onchange="applyFilters()"><option value="">Cidade</option></select>
                    <select id="fServ" onchange="applyFilters()"><option value="">Serviço</option></select>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button class="btn btn-outline" onclick="massMark()">Marcar Visíveis como Aberto</button>
                    <button class="btn btn-outline" onclick="clearFilters()">Limpar Filtros</button>
                </div>
            </section>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">O.S</th>
                            <th style="width: 140px;">Data/Hora</th>
                            <th style="width: 250px;">Cliente</th>
                            <th style="width: 150px;">Cidade</th>
                            <th style="width: 180px;">Serviço</th>
                            <th style="width: 180px;">Equipe</th>
                            <th style="width: auto;">Ocorrência</th>
                            <th style="width: 120px;">Status</th>
                            <th style="width: 80px; text-align: right;">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"><span id="toast-msg"></span></div>

    <script>
        const MASTER_KEY = "$2a$10$Q2kXyLLkTCC5B3yZji9a3.DpwGfIxqoCxivdXlEX95CSREglkI/xG";
        const BIN_ID = "696fe1e1ae596e708fe97dbb";

        let allData = [];
        let filteredData = [];

        const SERVICOS_PERMITIDOS = [
            "BL-Inspeção", "BL-Instalação", "BL-Manutenção", "BL-Mudança de Comodo",
            "BL-Mudança de Comodato", "BL-Mudança de Endereço", "BL-Suporte",
            "BL-Troca com Mudança", "CB-Intalação", "Mesh-Instalação",
            "Mesh-Instalação sem troca", "Mesh-Instalação com troca",
            "BL-Reativação de cliente suspenço"
        ];

        window.onload = () => { syncFromCloud(); };

        async function syncFromCloud() {
            document.getElementById('cloud-status').innerText = "Sincronizando...";
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                if (data.record) {
                    allData = data.record.items || (Array.isArray(data.record) ? data.record : []);
                    document.getElementById('cloud-status').innerText = "Online (Sincronizado)";
                    updateDrops();
                    applyFilters();
                }
            } catch (e) {
                document.getElementById('cloud-status').innerText = "Erro na Nuvem";
                showToast("Erro ao carregar dados.");
            }
        }

        async function syncToCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ items: allData })
                });
                showToast("Nuvem Atualizada!");
            } catch (e) { showToast("Erro ao salvar."); }
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const workbook = XLSX.read(evt.target.result, { type: 'binary', cellDates: true });
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    // CRIAR MAPA DOS STATUS ATUAIS PARA PRESERVAR
                    const statusMap = {};
                    allData.forEach(item => {
                        const key = `${item.os}-${item.cliente}`.trim();
                        statusMap[key] = item.status;
                    });

                    const newData = rows.filter(row => {
                        const code = String(row['Código Encerramento'] || row['codigo_encerramento'] || '').trim();
                        const servico = String(row['Tipo de Serviço'] || row['tipo_servico'] || '').trim();
                        return code === '153' && SERVICOS_PERMITIDOS.includes(servico);
                    }).map((row, index) => {
                        const os = String(row['cód o.s'] || row['os'] || '').trim();
                        const cliente = row['Cliente'] || 'N/A';
                        const key = `${os}-${cliente}`.trim();

                        return {
                            os: os || "##",
                            id: `ID-${os}-${cliente}-${index}`,
                            dataStr: row['Data Agendamento'] ? formatDT(row['Data Agendamento']) : '---',
                            dataISO: row['Data Agendamento'] ? new Date(row['Data Agendamento']).toISOString().split('T')[0] : '',
                            cliente: cliente,
                            cidade: row['Cidade'] || 'N/A',
                            tipo: row['Tipo de Serviço'] || 'N/A',
                            equipe: row['Nome Equipe'] || 'N/A',
                            ocorrencia: row['Ocorrência do Contrato'] || '---',
                            // PRESERVAÇÃO: Se já existia e estava ABERTO, mantém ABERTO. Senão, PENDENTE.
                            status: statusMap[key] === 'ABERTO' ? 'ABERTO' : 'PENDENTE'
                        };
                    });
                    
                    allData = newData;
                    await syncToCloud(); 
                    updateDrops();
                    applyFilters();
                } catch(err) { showToast("Erro no arquivo!"); }
            };
            reader.readAsBinaryString(file);
            this.value = '';
        });

        function applyFilters() {
            const os = document.getElementById('fOS').value.toLowerCase();
            const cli = document.getElementById('fCli').value.toLowerCase();
            const dt = document.getElementById('fDate').value;
            const ci = document.getElementById('fCity').value;
            const se = document.getElementById('fServ').value;

            filteredData = allData.filter(i => {
                return i.os.toLowerCase().includes(os) &&
                       i.cliente.toLowerCase().includes(cli) &&
                       (dt === "" || i.dataISO === dt) &&
                       (ci === "" || i.cidade === ci) &&
                       (se === "" || i.tipo === se);
            });
            render();
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            filteredData.forEach(item => {
                const isDone = item.status === 'ABERTO';
                const tr = document.createElement('tr');
                if (isDone) tr.classList.add('row-opened');

                tr.innerHTML = `
                    <td><strong>${item.os}</strong></td>
                    <td>${item.dataStr}</td>
                    <td>${item.cliente}</td>
                    <td>${item.cidade}</td>
                    <td>${item.tipo}</td>
                    <td>${item.equipe}</td>
                    <td><div class="txt-full">${item.ocorrencia}</div></td>
                    <td><span class="badge ${isDone ? 'badge-opened' : 'badge-pending'}">${item.status}</span></td>
                    <td style="text-align: right;">
                        <button class="btn btn-sm ${isDone ? 'btn-outline' : 'btn-primary'}" onclick="toggleStatus('${item.id}')">
                            <i class="fas ${isDone ? 'fa-undo' : 'fa-check'}"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            updateStats();
        }

        async function toggleStatus(id) {
            const index = allData.findIndex(item => item.id === id);
            if (index !== -1) {
                allData[index].status = allData[index].status === 'ABERTO' ? 'PENDENTE' : 'ABERTO';
                render();
                await syncToCloud();
            }
        }

        async function massMark() {
            filteredData.forEach(item => {
                const index = allData.findIndex(i => i.id === item.id);
                if (index !== -1) allData[index].status = 'ABERTO';
            });
            render();
            await syncToCloud();
        }

        function formatDT(d) {
            const date = new Date(d);
            return isNaN(date) ? d : date.toLocaleDateString('pt-BR') + ' ' + date.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        }

        function updateStats() {
            const total = allData.length;
            const opCount = allData.filter(i => i.status === 'ABERTO').length;
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = total - opCount;
            document.getElementById('stat-opened').innerText = opCount;
        }

        function updateDrops() {
            const cities = [...new Set(allData.map(i => i.cidade))].sort();
            const services = [...new Set(allData.map(i => i.tipo))].sort();
            document.getElementById('fCity').innerHTML = '<option value="">Cidade</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('fServ').innerHTML = '<option value="">Serviço</option>' + services.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function showToast(m) { 
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function limparTudo() {
            if(confirm("Zerar todos os dados?")) {
                allData = [];
                syncToCloud();
                location.reload();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('main-content').classList.toggle('expanded');
        }

        function toggleTheme() { document.body.classList.toggle('dark-mode'); }

        function clearFilters() {
            document.querySelectorAll('.filters-grid input, .filters-grid select').forEach(el => el.value = '');
            applyFilters();
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dados");
            XLSX.writeFile(wb, "Controle_ISP.xlsx");
        }
    </script>
</body>
</html>
